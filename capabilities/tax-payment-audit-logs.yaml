naftiko: 1.0.0-alpha2
info:
  label: Remitian Tax Payment API — Audit Logs
  description: 'Remitian Tax Payment API — Audit Logs. 1 operations. Lead operation: List audit logs. Self-contained Naftiko
    capability covering one Remitian business surface.'
  tags:
  - Remitian
  - Audit Logs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REMITIAN_API_KEY: REMITIAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: tax-payment-audit-logs
    baseUri: https://api.remitian.com
    description: Remitian Tax Payment API — Audit Logs business capability. Self-contained, no shared references.
    resources:
    - name: v1-audit-logs
      path: /v1/audit-logs
      operations:
      - name: listauditlogs
        method: GET
        description: List audit logs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: paymentId
          in: query
          type: string
          description: Filter logs by payment identifier
        - name: accountId
          in: query
          type: string
          description: Filter logs by account identifier
        - name: eventType
          in: query
          type: string
          description: Filter by audit event type
    authentication:
      type: bearer
      token: '{{env.REMITIAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: tax-payment-audit-logs-rest
    port: 8080
    description: REST adapter for Remitian Tax Payment API — Audit Logs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/audit-logs
      name: v1-audit-logs
      description: REST surface for v1-audit-logs.
      operations:
      - method: GET
        name: listauditlogs
        description: List audit logs
        call: tax-payment-audit-logs.listauditlogs
        with:
          paymentId: rest.paymentId
          accountId: rest.accountId
          eventType: rest.eventType
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tax-payment-audit-logs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Remitian Tax Payment API — Audit Logs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-audit-logs
      description: List audit logs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tax-payment-audit-logs.listauditlogs
      with:
        paymentId: tools.paymentId
        accountId: tools.accountId
        eventType: tools.eventType
      outputParameters:
      - type: object
        mapping: $.
