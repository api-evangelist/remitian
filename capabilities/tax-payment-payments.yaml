naftiko: 1.0.0-alpha2
info:
  label: Remitian Tax Payment API — Payments
  description: 'Remitian Tax Payment API — Payments. 6 operations. Lead operation: List payments. Self-contained Naftiko capability
    covering one Remitian business surface.'
  tags:
  - Remitian
  - Payments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REMITIAN_API_KEY: REMITIAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: tax-payment-payments
    baseUri: https://api.remitian.com
    description: Remitian Tax Payment API — Payments business capability. Self-contained, no shared references.
    resources:
    - name: v1-payments
      path: /v1/payments
      operations:
      - name: listpayments
        method: GET
        description: List payments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: initiatepayment
        method: POST
        description: Initiate a tax payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-payments-paymentId
      path: /v1/payments/{paymentId}
      operations:
      - name: getpayment
        method: GET
        description: Retrieve a payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-payments-paymentId-cancel
      path: /v1/payments/{paymentId}/cancel
      operations:
      - name: cancelpayment
        method: POST
        description: Cancel a payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-payments-paymentId-confirm
      path: /v1/payments/{paymentId}/confirm
      operations:
      - name: confirmpayment
        method: POST
        description: Confirm a payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-payments-paymentId-validate
      path: /v1/payments/{paymentId}/validate
      operations:
      - name: validatepayment
        method: POST
        description: Validate a payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.REMITIAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: tax-payment-payments-rest
    port: 8080
    description: REST adapter for Remitian Tax Payment API — Payments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/payments
      name: v1-payments
      description: REST surface for v1-payments.
      operations:
      - method: GET
        name: listpayments
        description: List payments
        call: tax-payment-payments.listpayments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: initiatepayment
        description: Initiate a tax payment
        call: tax-payment-payments.initiatepayment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/payments/{paymentid}
      name: v1-payments-paymentid
      description: REST surface for v1-payments-paymentId.
      operations:
      - method: GET
        name: getpayment
        description: Retrieve a payment
        call: tax-payment-payments.getpayment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/payments/{paymentid}/cancel
      name: v1-payments-paymentid-cancel
      description: REST surface for v1-payments-paymentId-cancel.
      operations:
      - method: POST
        name: cancelpayment
        description: Cancel a payment
        call: tax-payment-payments.cancelpayment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/payments/{paymentid}/confirm
      name: v1-payments-paymentid-confirm
      description: REST surface for v1-payments-paymentId-confirm.
      operations:
      - method: POST
        name: confirmpayment
        description: Confirm a payment
        call: tax-payment-payments.confirmpayment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/payments/{paymentid}/validate
      name: v1-payments-paymentid-validate
      description: REST surface for v1-payments-paymentId-validate.
      operations:
      - method: POST
        name: validatepayment
        description: Validate a payment
        call: tax-payment-payments.validatepayment
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tax-payment-payments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Remitian Tax Payment API — Payments. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-payments
      description: List payments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tax-payment-payments.listpayments
      outputParameters:
      - type: object
        mapping: $.
    - name: initiate-tax-payment
      description: Initiate a tax payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tax-payment-payments.initiatepayment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-payment
      description: Retrieve a payment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tax-payment-payments.getpayment
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-payment
      description: Cancel a payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tax-payment-payments.cancelpayment
      outputParameters:
      - type: object
        mapping: $.
    - name: confirm-payment
      description: Confirm a payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tax-payment-payments.confirmpayment
      outputParameters:
      - type: object
        mapping: $.
    - name: validate-payment
      description: Validate a payment
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: tax-payment-payments.validatepayment
      outputParameters:
      - type: object
        mapping: $.
