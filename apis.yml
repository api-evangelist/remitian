aid: remitian
name: Remitian
description: >-
  Remitian is a fintech platform providing embedded tax payment infrastructure for tax software providers and accounting
  firms. Often described as the "Stripe for tax," Remitian offers a developer-friendly API that acts as a unified
  gateway to multiple tax authorities, enabling automated, jurisdiction-aware payment processing. The platform raised
  $7M in seed funding in 2026 and enables partners to embed payment initiation, validation, and confirmation directly
  within their existing platforms, replacing manual government portal logins with automated payment infrastructure.
